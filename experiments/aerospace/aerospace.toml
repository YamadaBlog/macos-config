# AeroSpace — TRIAL ABANDONED on 2026-10-09 (hidden windows visible in the corner). Kept for reference; not installed.
# Behaviour: 1 window = full screen; each new window splits the space (i3 style).
# Reload after editing: aerospace reload-config   — Docs: https://nikitabobko.github.io/AeroSpace/guide

config-version = 2
start-at-login = false                 # startup handled by home-manager/startup.nix (LaunchAgent)
after-startup-command = []

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'   # side by side on a wide screen
accordion-padding = 30
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

# 8 px gaps everywhere (top is measured below the menu bar / notch).
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[mode.main.binding]
# Workspaces: Ctrl+digit = go; Ctrl+Shift+digit = send the active window there
ctrl-1 = 'workspace 1'
ctrl-2 = 'workspace 2'
ctrl-3 = 'workspace 3'
ctrl-4 = 'workspace 4'
ctrl-5 = 'workspace 5'
ctrl-6 = 'workspace 6'
ctrl-7 = 'workspace 7'
ctrl-8 = 'workspace 8'
ctrl-9 = 'workspace 9'
ctrl-shift-1 = 'move-node-to-workspace 1'
ctrl-shift-2 = 'move-node-to-workspace 2'
ctrl-shift-3 = 'move-node-to-workspace 3'
ctrl-shift-4 = 'move-node-to-workspace 4'
ctrl-shift-5 = 'move-node-to-workspace 5'
ctrl-shift-6 = 'move-node-to-workspace 6'
ctrl-shift-7 = 'move-node-to-workspace 7'
ctrl-shift-8 = 'move-node-to-workspace 8'
ctrl-shift-9 = 'move-node-to-workspace 9'
ctrl-alt-tab = 'workspace-back-and-forth'

# Focus / move (as before with OmniWM)
ctrl-left = 'focus left'
ctrl-right = 'focus right'
ctrl-up = 'focus up'
ctrl-down = 'focus down'
ctrl-shift-left = 'move left'
ctrl-shift-right = 'move right'
ctrl-shift-up = 'move up'
ctrl-shift-down = 'move down'

# Size and layout
ctrl-alt-f = 'fullscreen'                       # temporary fullscreen (same shortcut to exit)
ctrl-alt-minus = 'resize smart -80'
ctrl-alt-equal = 'resize smart +80'
ctrl-alt-r = 'balance-sizes'                    # restore equal shares
ctrl-alt-slash = 'layout tiles horizontal vertical'   # side by side <-> stacked
ctrl-alt-t = 'layout floating tiling'           # floating <-> tiled window

# Applications: assigned workspaces
[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace 3'

# Floating windows (settings, dialogs)
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

# Safari on workspace 2 ("Web"): apps with a minimum width (Safari ~570, Finder ~500)
# overflow to the right if too many windows share a workspace.
[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace 2'
